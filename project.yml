name: grau
options:
  deploymentTarget:
    macOS: "14.0"
  bundleIdPrefix: app.grau
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top
  xcodeVersion: "15.0"

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.9"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    DEAD_CODE_STRIPPING: YES
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      SWIFT_COMPILATION_MODE: wholemodule

packages:
  graucore:
    path: graucore
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.0"

targets:
  grau:
    type: application
    platform: macOS
    sources:
      - path: grau
        excludes:
          - "**/.DS_Store"
      - path: graucore
        type: folder
        buildPhase: none
      - path: grau/Assets.xcassets
      - path: grau/PrivacyInfo.xcprivacy
    dependencies:
      - package: graucore
        product: graucore
      - package: Sparkle
        product: Sparkle
    info:
      path: grau/Info.plist
      properties:
        CFBundleName: Grau
        CFBundleDisplayName: Grau
        CFBundleShortVersionString: "1.3.0"
        CFBundleVersion: "1"
        CFBundlePackageType: APPL
        LSMinimumSystemVersion: "14.0"
        LSUIElement: true
        CFBundleIconName: AppIcon
        NSHumanReadableCopyright: "MIT — see LICENSE"
        NSSupportsAutomaticTermination: true
        NSSupportsSuddenTermination: true
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
          NSAllowsLocalNetworking: true
        NSPrivacyTracking: false
        NSPrivacyTrackingDomains: []
        NSPrivacyCollectedDataTypes: []
        # Sparkle self-update. The feed URL points to the
        # GitHub-hosted appcast; the public key matches the
        # EdDSA private key in the developer's keychain. The
        # private key NEVER lands in this repo.
        SUFeedURL: "https://lucianodiisouza.github.io/grau/appcast.xml"
        SUPublicEDKey: "HPfimjRac1NUu1vIwNT5NW51BsVsdAWGMWrTTFcHIWM="
        SUEnableAutomaticChecks: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.grau.mac
        CODE_SIGN_ENTITLEMENTS: grau/grau.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        MARKETING_VERSION: "1.3.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: grau/Info.plist
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
